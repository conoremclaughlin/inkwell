# Supabase local development configuration

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15
# Vault's root key. Without this line every local stack uses the Supabase
# CLI's built-in key, the same on every machine, and Vault protects nothing.
# Start the root checkout's stack with `yarn supabase:start`, which reads the
# key from ~/.ink/secrets/supabase-db-root-key (scripts/lib/supabase-root-key.sh);
# a plain `supabase start` with SUPABASE_DB_ROOT_KEY unset leaves the database
# restarting. The integration harness and CI give each test stack its own.
root_key = "env(SUPABASE_DB_ROOT_KEY)"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[analytics]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
