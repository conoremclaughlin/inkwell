[package]
name = "inkwell-desktop"
version = "0.1.0"
description = "Inkwell desktop app - a thin native shell over the locally running web dashboard"
edition = "2021"
license = "MIT"
# Minimum supported Rust version. With resolver v3, cargo prefers dependency
# versions compatible with this MSRV instead of blindly taking the latest.
rust-version = "1.87"
resolver = "3"

[lib]
name = "inkwell_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
